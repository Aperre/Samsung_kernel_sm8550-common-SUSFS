name: Build Kernel

on:
  push:
    branches:
      - A-15_Upstream_Merged

  workflow_dispatch:
    inputs:
      zip_name:
        description: Final kernel zip name
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: build-kernel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build kernel
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    env:
      FINAL_KERNEL_ZIP: ${{ inputs.zip_name || format('S918B-Kernel-{0}.zip', github.sha) }}
      CCACHE_DIR: /home/runner/.cache/ccache
      CCACHE_MAXSIZE: 5G
      ADD_TIMESTAMP_TO_ZIP: 0
      CI: true

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            cpio \
            curl \
            dwarves \
            flex \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            gcc-arm-linux-gnueabihf \
            git \
            kmod \
            libelf-dev \
            libncurses-dev \
            libssl-dev \
            lld \
            llvm \
            openssl \
            patch \
            perl \
            python3 \
            unzip \
            wget \
            xz-utils \
            zip \
            zstd

      - name: Cache ccache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-${{ hashFiles('build.sh', 'arch/arm64/configs/gki_defconfig') }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ hashFiles('build.sh', 'arch/arm64/configs/gki_defconfig') }}-
            ccache-${{ runner.os }}-

      - name: Add swap
        run: |
          sudo fallocate -l 16G /tmp/swapbuild || \
            sudo dd if=/dev/zero of=/tmp/swapbuild bs=1G count=16 status=progress

          sudo chmod 600 /tmp/swapbuild
          sudo mkswap /tmp/swapbuild
          sudo swapon /tmp/swapbuild

          free -h

      - name: Cache Android clang
        uses: actions/cache@v5
        with:
          path: ~/Git/Clang/clang-r547379
          key: android-clang-r547379-linux-x86

      - name: Build
        run: |
          chmod +x ./build.sh

          ccache --zero-stats || true

          ./build.sh 2>&1 | tee build.log

          ccache --show-stats || true

      - name: Verify kernel ZIP
        run: |
          echo "Kernel ZIP(s):"
          find AnyKernel3 \
            -maxdepth 1 \
            -type f \
            -name '*.zip' \
            -print

          echo
          echo "SHA-256:"
          sha256sum AnyKernel3/*.zip

          echo
          echo "Kernel image:"
          ls -lh out/arch/arm64/boot/Image* 2>/dev/null || true

      - name: Upload kernel artifact
        uses: actions/upload-artifact@v7
        with:
          name: kernel-${{ github.sha }}
          path: AnyKernel3/*.zip
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-log-${{ github.sha }}
          path: build.log
          if-no-files-found: ignore

      # ------------------------------------------------------------
      # Release
      # ------------------------------------------------------------

      - name: Set release version
        id: version
        run: |
          VERSION="$(date -u +'%y.%m.%d')"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

          echo "Release version: $VERSION"

      - name: Rename kernel ZIP
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          for file in AnyKernel3/*.zip; do
            [ -f "$file" ] || continue

            new_name="S918B-Kernel-${VERSION}.zip"

            if [ "$(basename "$file")" != "$new_name" ]; then
              mv "$file" "AnyKernel3/$new_name"
            fi
          done

          ls -lh AnyKernel3/*.zip

      - name: Generate checksums
        run: |
          sha256sum AnyKernel3/*.zip > SHA256SUMS

          cat SHA256SUMS

      - name: Get ReSukiSU information
        id: sukisu
        run: |
          echo "variant=ReSukiSU" >> "$GITHUB_OUTPUT"

          if [ -d KernelSU/.git ]; then
            echo "commit=$(git -C KernelSU rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            echo "short_commit=$(git -C KernelSU rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          else
            echo "commit=unknown" >> "$GITHUB_OUTPUT"
            echo "short_commit=unknown" >> "$GITHUB_OUTPUT"
          fi

      - name: Delete existing same-day release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists."
            echo "Deleting existing release..."
            gh release delete "$TAG" --yes
          fi

          if git ls-remote --tags origin "refs/tags/$TAG" | grep -q "$TAG"; then
            echo "Deleting existing tag $TAG..."
            git push origin --delete "$TAG" || true
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="v${VERSION}"

          cat > release-notes.md <<EOF
          ## S918B Kernel ${VERSION}

          Samsung Galaxy S23 Ultra kernel build.

          ### Kernel

          - Version: ${VERSION}
          - Commit: \`${GITHUB_SHA}\`
          - Branch: \`${GITHUB_REF_NAME}\`

          ### Root

          - Framework: ReSukiSU
          - ReSukiSU commit: \`${{ steps.sukisu.outputs.short_commit }}\`
          - ReSukiSU full commit: \`${{ steps.sukisu.outputs.commit }}\`

          ### Toolchain

          - Clang: clang-r547379
          - Architecture: arm64

          ### Checksums

          \`\`\`
          $(cat SHA256SUMS)
          \`\`\`

          This release was automatically built by GitHub Actions.
          EOF

          gh release create "$TAG" \
            AnyKernel3/*.zip \
            SHA256SUMS \
            --title "S918B Kernel ${VERSION}" \
            --notes-file release-notes.md \
            --latest

      - name: Release summary
        run: |
          echo "## Kernel Release" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Version:** ${{ steps.version.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "**ReSukiSU:** ${{ steps.sukisu.outputs.short_commit }}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Commit:** ${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"

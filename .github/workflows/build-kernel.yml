name: Build kernel defaults

on:
  workflow_dispatch:
    inputs:
      zip_name:
        description: Final kernel zip name
        required: false
        default: ''
  push:
    branches:
      - A-15_Upstream_Merged
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-kernel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build kernel zip
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    env:
      FINAL_KERNEL_ZIP: ${{ inputs.zip_name || format('kernel-{0}.zip', github.sha) }}
      CCACHE_DIR: /home/runner/.cache/ccache
      CCACHE_MAXSIZE: 5G
      ADD_TIMESTAMP_TO_ZIP: 0
      CI: true

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            cpio \
            curl \
            dwarves \
            flex \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            gcc-arm-linux-gnueabihf \
            git \
            kmod \
            libelf-dev \
            libncurses-dev \
            libssl-dev \
            lld \
            llvm \
            openssl \
            patch \
            perl \
            python3 \
            unzip \
            wget \
            xz-utils \
            zip \
            zstd

      - name: Cache ccache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-${{ hashFiles('build.sh', 'arch/arm64/configs/gki_defconfig') }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ hashFiles('build.sh', 'arch/arm64/configs/gki_defconfig') }}-
            ccache-${{ runner.os }}-

      - name: Add swap
        run: |
          sudo fallocate -l 16G /tmp/swapbuild || sudo dd if=/dev/zero of=/tmp/swapbuild bs=1G count=16 status=progress
          sudo chmod 600 /tmp/swapbuild
          sudo mkswap /tmp/swapbuild
          sudo swapon /tmp/swapbuild
          free -h

      - name: Cache Android clang
        uses: actions/cache@v5
        with:
          path: ~/Git/Clang/clang-r547379
          key: android-clang-r547379-linux-x86

      - name: Build
        run: |
          chmod +x ./build.sh
          ccache --zero-stats || true
          ./build.sh
          ccache --show-stats || true

      - name: List outputs
        if: always()
        run: |
          find AnyKernel3 -maxdepth 1 -type f -name '*.zip' -print -exec sha1sum {} \; || true
          ls -lh out/arch/arm64/boot/Image* 2>/dev/null || true

      - name: Upload kernel zip
        uses: actions/upload-artifact@v7
        with:
          name: kernel-${{ github.sha }}
          path: AnyKernel3/*.zip
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
